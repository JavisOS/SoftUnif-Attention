# Phase-1 sparse latent relation tensor diagnostic against the original DeBERTa TRUA baseline.

model_type: deberta
epochs: 10
lr: 0.00002
batch_size: 16
eval_batch_size: 32
num_workers: 0

root: data
dataset: data_089907f8

gpus: "0"
strategy: single

seed: 42
lambda_nexthop: 1.0
lambda_edge: 1.0
lambda_consistency: 5.0
sparse_top_k: 8
force_gold_edges: true

entity_pooling: mean
prediction_head: cls_pair
edge_supervision_target: latent
pair_feature_mode: product
use_relation_conditioning: true
consistency_mode: kl
use_path_algebra: true
path_algebra_steps: 0
residual_gate_init: -1.5
lambda_gate: 0.01
lambda_alg: 0.05
lambda_eq: 0.1
relation_score_mode: bilinear
relation_rank: 32
