# TSRA-v3 fast diagnostic configuration for encoder-only models.
# Main changes vs the original TSRA draft:
# - gated fusion of global CLS and subject-object entity logits
# - direct supervision of latent relation logits on gold path edges

model_type: roberta
epochs: 10
lr: 0.00002
batch_size: 16
eval_batch_size: 64
num_workers: 0

root: data
dataset: data_089907f8

gpus: '0'
strategy: single

seed: 42
lambda_nexthop: 1.0
lambda_edge: 1.0
lambda_consistency: 5.0
entity_pooling: multi_mention
prediction_head: gated
edge_supervision_target: latent
pair_feature_mode: product
use_relation_conditioning: true
consistency_mode: kl
