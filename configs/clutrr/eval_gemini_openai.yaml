# Gemini evaluation on CLUTRR via OpenAI SDK compatible API (OpenRouter by default)

root: data
dataset: data_089907f8
split: test
limit: 100

# gemini3.0pro alias is supported and mapped to a valid OpenRouter model id.
model: gemini3.0pro
base_url: https://openrouter.ai/api/v1
temperature: 0.0
max_tokens: 256
retries: 3
sleep_seconds: 0.0

output_dir: outputs/gemini_eval
